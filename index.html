<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Enhanced To-Do List</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: rgba(79, 70, 229, 0.1);
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.12);
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.14);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.12);
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.07);
      --radius: 14px;
      --radius-sm: 10px;
      --transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg: #0b1120;
      --surface: #111827;
      --surface-2: #1e293b;
      --border: #273449;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --primary-soft: rgba(99, 102, 241, 0.18);
      --success: #34d399;
      --success-soft: rgba(52, 211, 153, 0.16);
      --warning: #fbbf24;
      --warning-soft: rgba(251, 191, 36, 0.16);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.16);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      transition: background var(--transition), color var(--transition);
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    .app-shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 16px 64px;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 20px;
      align-items: start;
    }

    /* Top Mobile/Desktop Header */
    .topbar {
      grid-column: 1 / -1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      color: #fff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.28);
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .icon-btn {
      height: 36px;
      padding: 0 11px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      transition: all var(--transition);
    }

    .icon-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    .icon-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Sidebar */
    .sidebar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .nav-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding: 0 6px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      width: 100%;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text);
      transition: all var(--transition);
    }

    .nav-item:hover {
      background: var(--surface-2);
    }

    .nav-item.active {
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 600;
    }

    .nav-item-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .badge-count {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-muted);
    }

    .nav-item.active .badge-count {
      background: var(--primary);
      color: #fff;
    }

    /* Pomodoro Card in Sidebar */
    .pomodoro-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pomodoro-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .pomodoro-mode {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .pomodoro-time {
      font-size: 1.85rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      text-align: center;
      padding: 4px 0;
    }

    .pomodoro-task {
      font-size: 0.76rem;
      color: var(--text-muted);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pomodoro-controls {
      display: flex;
      gap: 6px;
    }

    .pomodoro-controls button {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: all var(--transition);
    }

    .pomodoro-controls .btn-start {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .pomodoro-controls .btn-start:hover {
      background: var(--primary-hover);
    }

    /* Main Content */
    .main-area {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    /* Stats Row */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
    }

    .stat-label {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stat-value {
      font-size: 1.45rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .progress-bar-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      box-shadow: var(--shadow-sm);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: var(--surface-2);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--success));
      transition: width 0.35s ease;
      width: 0%;
    }

    /* Add Task Composer */
    .composer {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .composer-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .composer-input {
      flex: 1;
      min-width: 0;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 0.95rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .composer-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
      background: var(--surface);
    }

    .btn-primary {
      padding: 11px 18px;
      border-radius: var(--radius-sm);
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background var(--transition), transform 0.1s;
      white-space: nowrap;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .composer-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .meta-field {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.82rem;
    }

    .meta-field select,
    .meta-field input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 0.82rem;
      color: var(--text);
    }

    .meta-notes {
      flex: 1;
      min-width: 180px;
    }

    .meta-notes input {
      width: 100%;
    }

    /* Toolbar (Search + Sort + Clear) */
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-box input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.88rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .select-control {
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.85rem;
      outline: none;
    }

    /* Task List */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
    }

    .task-card:hover {
      box-shadow: var(--shadow-md);
    }

    .task-card.pinned {
      border-left: 4px solid var(--primary);
    }

    .task-card.completed {
      opacity: 0.68;
      background: var(--surface-2);
    }

    .task-main {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .check-btn {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid var(--border);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all var(--transition);
      color: transparent;
    }

    .check-btn:hover {
      border-color: var(--primary);
    }

    .task-card.completed .check-btn {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    .task-body {
      flex: 1;
      min-width: 0;
    }

    .task-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .task-title {
      font-size: 0.98rem;
      font-weight: 600;
      word-break: break-word;
    }

    .task-card.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-notes {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-top: 4px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .task-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      align-items: center;
    }

    .pill {
      font-size: 0.73rem;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pill-high { background: var(--danger-soft); color: var(--danger); }
    .pill-medium { background: var(--warning-soft); color: var(--warning); }
    .pill-low { background: var(--success-soft); color: var(--success); }
    .pill-cat { background: var(--primary-soft); color: var(--primary); }
    .pill-date { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
    .pill-overdue { background: var(--danger-soft); color: var(--danger); }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .action-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--text-muted);
      transition: all var(--transition);
    }

    .action-btn:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .action-btn.pinned-active {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .action-btn.delete-btn:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    /* Subtasks */
    .subtasks-wrap {
      margin-left: 34px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .subtask-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
    }

    .subtask-item.done span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .subtask-check {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      border: 1.5px solid var(--border);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: transparent;
    }

    .subtask-item.done .subtask-check {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    .subtask-del {
      margin-left: auto;
      color: var(--text-muted);
      font-size: 0.78rem;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .subtask-del:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .subtask-add-row {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }

    .subtask-add-row input {
      flex: 1;
      padding: 5px 9px;
      font-size: 0.8rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      outline: none;
    }

    .subtask-add-row button {
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 7px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    /* Empty State */
    .empty-state {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 44px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state h3 {
      font-size: 1rem;
      color: var(--text);
      margin: 10px 0 4px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      display: none;
      place-items: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: grid;
    }

    .modal-card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      outline: none;
      font-size: 0.9rem;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 76px;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-ghost {
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 0.86rem;
      font-weight: 600;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0f172a;
      color: #fff;
      padding: 11px 16px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.86rem;
      z-index: 200;
      transform: translateY(120px);
      opacity: 0;
      transition: all 0.25s ease;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast-action {
      color: #818cf8;
      font-weight: 700;
      text-decoration: underline;
    }

    @media (max-width: 860px) {
      .app-shell {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: static;
      }
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      .composer-row {
        flex-direction: column;
        align-items: stretch;
      }
      .form-row-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </div>
        <div>
          <h1>TaskFlow</h1>
          <p id="today-date-label">Smart To-Do &amp; Focus Workspace</p>
        </div>
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" id="sound-toggle" title="Toggle sound effects">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <span id="sound-label">Sound On</span>
        </button>
        <button class="icon-btn" id="export-btn" title="Export tasks as JSON">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Export</span>
        </button>
        <button class="icon-btn" id="import-btn" title="Import tasks from JSON">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>Import</span>
        </button>

    <!-- Main Workspace -->
    <main class="main-area">
      <!-- Stats -->
      <section class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Tasks</div>
          <div class="stat-value" id="stat-total">0</div>

        <div class="stat-card">
          <div class="stat-label">Pending</div>
          <div class="stat-value" id="stat-pending">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Completed</div>
          <div class="stat-value" id="stat-done">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Overdue</div>
          <div class="stat-value" id="stat-overdue">0</div>
        </div>
      </section>

      <div class="progress-bar-wrap">
        <div class="progress-header">
          <span>Overall Completion</span>
          <span id="progress-pct">0%</span>

      </div>

      <!-- Task Composer -->
      <form class="composer" id="task-form">
        <div class="composer-row">
          <input
            type="text"

          <button type="submit" class="btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Task

        <div class="composer-meta">
          <label class="meta-field">
            <span>Priority:</span>
            <select id="task-priority-input">

            <span>Category:</span>
            <select id="task-category-input">
              <option value="Work">Work</option>

      <!-- Search & Sort Toolbar -->

  <!-- Edit Task Modal -->
  <div class="modal-backdrop" id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
    <form class="modal-card" id="edit-form">
      <div class="modal-header">
        <h2 id="edit-modal-title">Edit Task</h2>
        <button type="button" class="action-btn" id="close-modal-btn" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="form-group">
        <label for="edit-title">Task Title</label>
        <input type="text" id="edit-title" required />
      </div>
      <div class="form-row-2">
        <div class="form-group">
          <label for="edit-priority">Priority</label>
          <select id="edit-priority">
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>

          <label for="edit-category">Category</label>
          <select id="edit-category">
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Study">Study</option>
            <option value="Health">Health</option>
            <option value="Shopping">Shopping</option>
          </select>
        </div>

        <label for="edit-date">Due Date</label>
        <input type="date" id="edit-date" />

      </div>

        <button type="submit" class="btn-primary">Save Changes</button>

  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toast-msg"></span>
    <button type="button" class="toast-action" id="toast-action-btn" hidden>Undo</button>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'taskflow_tasks_v2';
      const THEME_KEY = 'taskflow_theme_v2';
      const SOUND_KEY = 'taskflow_sound_v2';
      const CATEGORIES = ['Work', 'Personal', 'Study', 'Health', 'Shopping'];

      const todayStr = () => {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      };

      const addDaysStr = (days) => {
        const d = new Date();
        d.setDate(d.getDate() + days);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      };

      const uid = () =>
        (typeof crypto !== 'undefined' && crypto.randomUUID)
          ? crypto.randomUUID()
          : 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);

      const safeGet = (key, fallback) => {
        try {
          const val = localStorage.getItem(key);
          return val !== null ? val : fallback;
        } catch {
          return fallback;
        }
      };

      const safeSet = (key, val) => {
        try {
          localStorage.setItem(key, val);
        } catch {
          // Ignore storage errors in restricted contexts
        }
      };

      const defaultTasks = () => [
        {
          id: uid(),
          title: 'Review project priorities & daily goals',
          notes: 'Check high-priority items and start a 25m Focus session.',
          priority: 'high',
          category: 'Work',
          dueDate: todayStr(),
          completed: false,
          pinned: true,
          subtasks: [
            { id: uid(), text: 'Pick top 3 must-do tasks', done: true },
            { id: uid(), text: 'Block 25 mins for deep work', done: false }
          ],
          createdAt: Date.now() - 30000
        },
        {
          id: uid(),
          title: 'Evening workout or 30-min brisk walk',
          notes: 'Stay hydrated and stretch afterwards.',
          priority: 'medium',
          category: 'Health',
          dueDate: todayStr(),
          completed: false,
          pinned: false,
          subtasks: [],
          createdAt: Date.now() - 20000
        },
        {
          id: uid(),
          title: 'Organize weekly reading & study notes',
          notes: '',
          priority: 'low',
          category: 'Study',
          dueDate: addDaysStr(2),
          completed: false,
          pinned: false,
          subtasks: [],
          createdAt: Date.now() - 10000
        }
      ];

      let tasks = (() => {
        const raw = safeGet(STORAGE_KEY, null);
        if (raw === null) {
          const seeded = defaultTasks();
          safeSet(STORAGE_KEY, JSON.stringify(seeded));
          return seeded;
        }
        try {
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      })();

      let state = {
        view: 'all',
        category: 'all',
        search: '',
        sort: 'pinned',
        editingId: null,
        soundEnabled: safeGet(SOUND_KEY, 'true') !== 'false',
        theme: safeGet(THEME_KEY, 'light'),
        lastDeleted: null
      };

      // Audio chime using Web Audio API (no external audio files)
      const playTone = (freq = 580, duration = 0.09) => {
        if (!state.soundEnabled) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch {
          // Ignore audio errors
        }
      };

      // Elements
      const el = {
        todayDateLabel: document.getElementById('today-date-label'),
        taskForm: document.getElementById('task-form'),
        titleInput: document.getElementById('task-title-input'),
        priorityInput: document.getElementById('task-priority-input'),
        categoryInput: document.getElementById('task-category-input'),
        dateInput: document.getElementById('task-date-input'),
        notesInput: document.getElementById('task-notes-input'),
        searchInput: document.getElementById('search-input'),
        sortSelect: document.getElementById('sort-select'),
        clearCompletedBtn: document.getElementById('clear-completed-btn'),
        taskList: document.getElementById('task-list'),
        viewFilters: document.getElementById('view-filters'),
        categoryFilters: document.getElementById('category-filters'),
        themeToggle: document.getElementById('theme-toggle'),
        themeLabel: document.getElementById('theme-label'),
        soundToggle: document.getElementById('sound-toggle'),
        soundLabel: document.getElementById('sound-label'),
        exportBtn: document.getElementById('export-btn'),
        importBtn: document.getElementById('import-btn'),
        importFile: document.getElementById('import-file'),
        editModal: document.getElementById('edit-modal'),
        editForm: document.getElementById('edit-form'),
        editTitle: document.getElementById('edit-title'),
        editPriority: document.getElementById('edit-priority'),
        editCategory: document.getElementById('edit-category'),
        editDate: document.getElementById('edit-date'),
        editNotes: document.getElementById('edit-notes'),
        closeModalBtn: document.getElementById('close-modal-btn'),
        cancelEditBtn: document.getElementById('cancel-edit-btn'),
        toast: document.getElementById('toast'),
        toastMsg: document.getElementById('toast-msg'),
        toastActionBtn: document.getElementById('toast-action-btn'),
        pomoMode: document.getElementById('pomo-mode'),
        pomoDisplay: document.getElementById('pomo-display'),
        pomoTaskLabel: document.getElementById('pomo-task-label'),
        pomoStart: document.getElementById('pomo-start'),
        pomoSwitch: document.getElementById('pomo-switch'),
        pomoReset: document.getElementById('pomo-reset')
      };

      // Toast helper
      let toastTimer = null;
      const showToast = (msg, undoCallback = null) => {
        el.toastMsg.textContent = msg;
        if (undoCallback) {
          el.toastActionBtn.hidden = false;
          el.toastActionBtn.onclick = () => {
            undoCallback();
            el.toast.classList.remove('show');
          };
        } else {
          el.toastActionBtn.hidden = true;
          el.toastActionBtn.onclick = null;
        }
        el.toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.toast.classList.remove('show'), 4000);
      };

      const saveTasks = () => {
        safeSet(STORAGE_KEY, JSON.stringify(tasks));
      };

      const applyTheme = () => {
        document.documentElement.setAttribute('data-theme', state.theme);
        el.themeLabel.textContent = state.theme === 'dark' ? 'Light' : 'Dark';
        safeSet(THEME_KEY, state.theme);
      };

      const applySoundUI = () => {
        el.soundLabel.textContent = state.soundEnabled ? 'Sound On' : 'Muted';
        el.soundToggle.classList.toggle('active', state.soundEnabled);
        safeSet(SOUND_KEY, String(state.soundEnabled));
      };

      // Formatting helpers
      const escapeHtml = (str) =>
        String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');

      const formatDateLabel = (dateStr) => {
        if (!dateStr) return '';
        const t = todayStr();
        if (dateStr === t) return 'Today';
        if (dateStr === addDaysStr(1)) return 'Tomorrow';
        const parts = dateStr.split('-');
        const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      };

      const isOverdue = (task) => !task.completed && task.dueDate && task.dueDate < todayStr();

      // Filtering & Sorting
      const getFilteredTasks = () => {
        const t = todayStr();
        const q = state.search.trim().toLowerCase();

        let list = tasks.filter((task) => {
          if (state.view === 'today' && task.dueDate !== t) return false;
          if (state.view === 'upcoming' && (!task.dueDate || task.dueDate <= t || task.completed)) return false;
          if (state.view === 'high' && (task.priority !== 'high' || task.completed)) return false;
          if (state.view === 'completed' && !task.completed) return false;

          if (state.category !== 'all' && task.category !== state.category) return false;

          if (q) {
            const hay = `${task.title} ${task.notes || ''} ${task.category}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        const prioRank = { high: 0, medium: 1, low: 2 };
        list.sort((a, b) => {
          if (a.completed !== b.completed) return a.completed ? 1 : -1;
          if (state.sort === 'pinned') {
            if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
            return b.createdAt - a.createdAt;
          }
          if (state.sort === 'priority') {
            const diff = prioRank[a.priority] - prioRank[b.priority];
            return diff !== 0 ? diff : b.createdAt - a.createdAt;
          }
          if (state.sort === 'due') {
            if (!a.dueDate && !b.dueDate) return b.createdAt - a.createdAt;
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return a.dueDate.localeCompare(b.dueDate);
          }
          if (state.sort === 'alpha') {
            return a.title.localeCompare(b.title);
          }
          return 0;
        });

        return list;
      };

      // Render Stats & Sidebar Counts
      const renderMeta = () => {
        const t = todayStr();
        const total = tasks.length;
        const done = tasks.filter((x) => x.completed).length;
        const pending = total - done;
        const overdue = tasks.filter(isOverdue).length;
        const pct = total === 0 ? 0 : Math.round((done / total) * 100);

        document.getElementById('stat-total').textContent = total;
        document.getElementById('stat-pending').textContent = pending;
        document.getElementById('stat-done').textContent = done;
        document.getElementById('stat-overdue').textContent = overdue;
        document.getElementById('progress-pct').textContent = `${pct}%`;
        document.getElementById('progress-fill').style.width = `${pct}%`;

        document.getElementById('count-all').textContent = total;
        document.getElementById('count-today').textContent = tasks.filter((x) => x.dueDate === t).length;
        document.getElementById('count-upcoming').textContent = tasks.filter((x) => x.dueDate && x.dueDate > t && !x.completed).length;
        document.getElementById('count-high').textContent = tasks.filter((x) => x.priority === 'high' && !x.completed).length;
        document.getElementById('count-completed').textContent = done;

        // Category pills
        const catCounts = { all: total };
        CATEGORIES.forEach((c) => (catCounts[c] = 0));
        tasks.forEach((x) => {
          if (catCounts[x.category] !== undefined) catCounts[x.category]++;
        });

        el.categoryFilters.innerHTML = ['all', ...CATEGORIES]
          .map((cat) => {
            const label = cat === 'all' ? 'All Categories' : cat;
            const active = state.category === cat ? 'active' : '';
            return `
              <button class="nav-item ${active}" data-category="${escapeHtml(cat)}">
                <span class="nav-item-left">${escapeHtml(label)}</span>
                <span class="badge-count">${catCounts[cat] || 0}</span>
              </button>
            `;
          })
          .join('');
      };

      const renderTasks = () => {
        renderMeta();
        const filtered = getFilteredTasks();

        if (filtered.length === 0) {
          el.taskList.innerHTML = `
            <div class="empty-state">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              <h3>No tasks match this view</h3>
              <p>Add a new task above or switch filters to see your list.</p>
            </div>
          `;
          return;
        }

        el.taskList.innerHTML = filtered
          .map((task) => {
            const overdue = isOverdue(task);
            const dateBadge = task.dueDate
              ? `<span class="pill ${overdue ? 'pill-overdue' : 'pill-date'}">${overdue ? 'Overdue · ' : ''}${escapeHtml(formatDateLabel(task.dueDate))}</span>`
              : '';
            const subtasksHtml = (task.subtasks || [])
              .map(
                (st) => `
                <div class="subtask-item ${st.done ? 'done' : ''}" data-subid="${escapeHtml(st.id)}">
                  <button type="button" class="subtask-check" data-action="toggle-sub" aria-label="Toggle subtask">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                  </button>
                  <span>${escapeHtml(st.text)}</span>
                  <button type="button" class="subtask-del" data-action="del-sub" title="Remove subtask">&times;</button>
                </div>
              `
              )
              .join('');

            return `
              <article class="task-card ${task.completed ? 'completed' : ''} ${task.pinned ? 'pinned' : ''}" data-id="${escapeHtml(task.id)}">
                <div class="task-main">
                  <button type="button" class="check-btn" data-action="toggle" aria-label="Mark task complete">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                  </button>
                  <div class="task-body">
                    <div class="task-title-row">
                      <span class="task-title">${escapeHtml(task.title)}</span>
                    </div>
                    ${task.notes ? `<p class="task-notes">${escapeHtml(task.notes)}</p>` : ''}
                    <div class="task-tags">
                      <span class="pill pill-${escapeHtml(task.priority)}">${escapeHtml(task.priority.toUpperCase())}</span>
                      <span class="pill pill-cat">${escapeHtml(task.category)}</span>
                      ${dateBadge}
                    </div>
                  </div>
                  <div class="task-actions">
                    <button type="button" class="action-btn" data-action="focus" title="Focus on this task">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
                    </button>
                    <button type="button" class="action-btn ${task.pinned ? 'pinned-active' : ''}" data-action="pin" title="Pin task">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="${task.pinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    </button>
                    <button type="button" class="action-btn" data-action="edit" title="Edit task">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                    <button type="button" class="action-btn delete-btn" data-action="delete" title="Delete task">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                  </div>
                </div>
                <div class="subtasks-wrap">
                  ${subtasksHtml}
                  <div class="subtask-add-row">
                    <input type="text" class="subtask-input" placeholder="Add a subtask..." />
                    <button type="button" data-action="add-sub">+ Subtask</button>
                  </div>
                </div>
              </article>
            `;
          })
          .join('');
      };

      // Event Listeners
      el.taskForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const title = el.titleInput.value.trim();
        if (!title) return;

        tasks.unshift({
          id: uid(),
          title,
          notes: el.notesInput.value.trim(),
          priority: el.priorityInput.value,
          category: el.categoryInput.value,
          dueDate: el.dateInput.value,
          completed: false,
          pinned: false,
          subtasks: [],
          createdAt: Date.now()
        });

        saveTasks();
        renderTasks();
        playTone(640, 0.08);
        el.titleInput.value = '';
        el.notesInput.value = '';
        el.titleInput.focus();
      });

      el.taskList.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const card = btn.closest('.task-card');
        if (!card) return;
        const id = card.dataset.id;
        const task = tasks.find((t) => t.id === id);
        if (!task) return;

        const action = btn.dataset.action;

        if (action === 'toggle') {
          task.completed = !task.completed;
          saveTasks();
          renderTasks();
          playTone(task.completed ? 780 : 440, 0.1);
        } else if (action === 'pin') {
          task.pinned = !task.pinned;
          saveTasks();
          renderTasks();
        } else if (action === 'delete') {
          const idx = tasks.findIndex((t) => t.id === id);
          const removed = tasks.splice(idx, 1)[0];
          saveTasks();
          renderTasks();
          showToast('Task deleted', () => {
            tasks.splice(idx, 0, removed);
            saveTasks();
            renderTasks();
          });
        } else if (action === 'edit') {
          state.editingId = id;
          el.editTitle.value = task.title;
          el.editPriority.value = task.priority;
          el.editCategory.value = task.category;
          el.editDate.value = task.dueDate || '';
          el.editNotes.value = task.notes || '';
          el.editModal.classList.add('open');
          el.editTitle.focus();
        } else if (action === 'focus') {
          setPomodoroTask(task.title);
          showToast(`Focus set: ${task.title}`);
        } else if (action === 'add-sub') {
          const input = card.querySelector('.subtask-input');
          const text = input ? input.value.trim() : '';
          if (!text) return;
          task.subtasks = task.subtasks || [];
          task.subtasks.push({ id: uid(), text, done: false });
          saveTasks();
          renderTasks();
        } else if (action === 'toggle-sub') {
          const subEl = btn.closest('.subtask-item');
          const sub = (task.subtasks || []).find((s) => s.id === subEl.dataset.subid);
          if (sub) {
            sub.done = !sub.done;
            saveTasks();
            renderTasks();
            playTone(sub.done ? 720 : 480, 0.06);
          }
        } else if (action === 'del-sub') {
          const subEl = btn.closest('.subtask-item');
          task.subtasks = (task.subtasks || []).filter((s) => s.id !== subEl.dataset.subid);
          saveTasks();
          renderTasks();
        }
      });

      el.taskList.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.classList.contains('subtask-input')) {
          e.preventDefault();
          const card = e.target.closest('.task-card');
          const addBtn = card && card.querySelector('[data-action="add-sub"]');
          if (addBtn) addBtn.click();
        }
      });

      // Sidebar View & Category Filters
      el.viewFilters.addEventListener('click', (e) => {
        const item = e.target.closest('[data-view]');
        if (!item) return;
        state.view = item.dataset.view;
        el.viewFilters.querySelectorAll('.nav-item').forEach((n) => n.classList.remove('active'));
        item.classList.add('active');
        renderTasks();
      });

      el.categoryFilters.addEventListener('click', (e) => {
        const item = e.target.closest('[data-category]');
        if (!item) return;
        state.category = item.dataset.category;
        renderTasks();
      });

      el.searchInput.addEventListener('input', (e) => {
        state.search = e.target.value;
        renderTasks();
      });

      el.sortSelect.addEventListener('change', (e) => {
        state.sort = e.target.value;
        renderTasks();
      });

      el.clearCompletedBtn.addEventListener('click', () => {
        const completedCount = tasks.filter((t) => t.completed).length;
        if (completedCount === 0) {
          showToast('No completed tasks to clear');
          return;
        }
        const backup = [...tasks];
        tasks = tasks.filter((t) => !t.completed);
        saveTasks();
        renderTasks();
        showToast(`Cleared ${completedCount} completed task(s)`, () => {
          tasks = backup;
          saveTasks();
          renderTasks();
        });
      });

      // Edit Modal
      const closeModal = () => {
        el.editModal.classList.remove('open');
        state.editingId = null;
      };

      el.closeModalBtn.addEventListener('click', closeModal);
      el.cancelEditBtn.addEventListener('click', closeModal);
      el.editModal.addEventListener('click', (e) => {
        if (e.target === el.editModal) closeModal();
      });

      el.editForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const task = tasks.find((t) => t.id === state.editingId);
        if (!task) return;
        const title = el.editTitle.value.trim();
        if (!title) return;
        task.title = title;
        task.priority = el.editPriority.value;
        task.category = el.editCategory.value;
        task.dueDate = el.editDate.value;
        task.notes = el.editNotes.value.trim();
        saveTasks();
        renderTasks();
        closeModal();
        showToast('Task updated');
      });

      // Theme & Sound
      el.themeToggle.addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        applyTheme();
      });

      el.soundToggle.addEventListener('click', () => {
        state.soundEnabled = !state.soundEnabled;
        applySoundUI();
        if (state.soundEnabled) playTone(660, 0.08);
      });

      // Export & Import JSON
      el.exportBtn.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `taskflow-backup-${todayStr()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Exported tasks to JSON');
      });

      el.importBtn.addEventListener('click', () => el.importFile.click());
      el.importFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const imported = JSON.parse(ev.target.result);
            if (!Array.isArray(imported)) throw new Error('Invalid format');
            tasks = imported;
            saveTasks();
            renderTasks();
            showToast(`Imported ${imported.length} task(s)`);
          } catch {
            showToast('Invalid JSON backup file');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      });

      // Keyboard shortcut `/` to focus search, `Escape` to close modal
      document.addEventListener('keydown', (e) => {
        if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
          e.preventDefault();
          el.searchInput.focus();
        }
        if (e.key === 'Escape' && el.editModal.classList.contains('open')) {
          closeModal();
        }
      });

      // Pomodoro Focus Timer
      let pomo = {
        mode: 'focus', // 'focus' | 'break'
        secondsLeft: 25 * 60,
        running: false,
        intervalId: null
      };

      const renderPomo = () => {
        const mins = String(Math.floor(pomo.secondsLeft / 60)).padStart(2, '0');
        const secs = String(pomo.secondsLeft % 60).padStart(2, '0');
        el.pomoDisplay.textContent = `${mins}:${secs}`;
        el.pomoMode.textContent = pomo.mode === 'focus' ? '25m Focus' : '5m Break';
        el.pomoStart.textContent = pomo.running ? 'Pause' : 'Start';
        el.pomoSwitch.textContent = pomo.mode === 'focus' ? 'Break' : 'Focus';
      };

      const stopPomo = () => {
        clearInterval(pomo.intervalId);
        pomo.intervalId = null;
        pomo.running = false;
        renderPomo();
      };

      const setPomodoroTask = (title) => {
        el.pomoTaskLabel.textContent = `Focusing: ${title}`;
      };

      el.pomoStart.addEventListener('click', () => {
        if (pomo.running) {
          stopPomo();
          return;
        }
        pomo.running = true;
        renderPomo();
        clearInterval(pomo.intervalId);
        pomo.intervalId = setInterval(() => {
          pomo.secondsLeft -= 1;
          if (pomo.secondsLeft <= 0) {
            stopPomo();
            playTone(880, 0.25);
            showToast(pomo.mode === 'focus' ? 'Focus session complete! Take a break.' : 'Break finished! Ready to focus.');
            pomo.secondsLeft = pomo.mode === 'focus' ? 25 * 60 : 5 * 60;
          }
          renderPomo();
        }, 1000);
      });

      el.pomoSwitch.addEventListener('click', () => {
        stopPomo();
        pomo.mode = pomo.mode === 'focus' ? 'break' : 'focus';
        pomo.secondsLeft = pomo.mode === 'focus' ? 25 * 60 : 5 * 60;
        renderPomo();
      });

      el.pomoReset.addEventListener('click', () => {
        stopPomo();
        pomo.secondsLeft = pomo.mode === 'focus' ? 25 * 60 : 5 * 60;
        renderPomo();
      });

      // Init
      el.todayDateLabel.textContent = new Date().toLocaleDateString(undefined, {
        weekday: 'long',
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
      applyTheme();
      applySoundUI();
      renderPomo();
      renderTasks();
    })();
  </script>
</body>
</html>
